      <stop offset="0" stop-color="#0d141c"/>
      <stop offset="1" stop-color="#101d28"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f3b4d"/>
      <stop offset="1" stop-color="#152b39"/>
