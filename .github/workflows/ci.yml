name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python (compile, tests, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        run: python -m pytest -q
      - name: Smoke run on the bundled samples
        run: PYTHONPATH=src python -m grantdecay report --entitlements samples/entitlements.txt --log samples/accesslog.txt
